name: Native Rust builds
on:
  push:
    paths:
      - 'Cargo.*'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'licenses/**'
      - 'build.rs'
      - 'src/**'
      - 'assets/**'
      - 'Makefile'
      - 'scripts/**'
      - '.cargo/**'
      - 'install.sh'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-install:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86-64
          - runner: ubuntu-24.04-arm
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and GTK dependencies
        run: |
          bash scripts/build.sh deps
          sudo apt-get install -y xvfb xauth desktop-file-utils shellcheck
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check shell and Rust
        run: |
          bash -n scripts/build.sh
          shellcheck scripts/build.sh scripts/run-dev install.sh
          cargo fmt --check
      - name: Build natively against matching NVIDIA headers
        run: make DRIVER_VERSION="$(cat data/nvidia-driver-version)"
      - name: Run Rust and GTK tests
        run: |
          export NVIBRANT_NVIDIA_HEADERS="$HOME/.cache/nvibrant/headers/$(cat data/nvidia-driver-version)"
          make test
          make test-gui
          cargo clippy --all-targets -- -D warnings
      - name: Verify installed payload and removal
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/install prefix"
          .build/bin/nvibrant --install "$prefix"
          "$prefix/bin/nvibrant-gtk" --version
          file "$prefix/lib/nvibrant/nvibrant"
          desktop-file-validate "$prefix/share/applications/io.github.nvibrant.Aero.desktop"
          desktop-file-validate "$HOME/.config/autostart/io.github.nvibrant.Aero.Restore.desktop"
          xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo "$prefix/bin/nvibrant-gtk" --smoke-test
          "$prefix/bin/nvibrant" --uninstall "$prefix"
          test ! -e "$prefix/bin/nvibrant-gtk"
