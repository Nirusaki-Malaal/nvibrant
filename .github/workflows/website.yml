name: website
on:
  workflow_dispatch:
  push:
    paths:
      - "readme.md"
      - "website/**"
      - "zensical.toml"
  schedule:
    - cron: "0 0 * * 5"

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  main:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: BrokenSource/Pages@main
      - uses: actions/upload-pages-artifact@v5
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages is not configured on this fork; website artifact is available above."
          fi
      - uses: actions/deploy-pages@v5
        if: steps.pages.outputs.enabled == 'true'
