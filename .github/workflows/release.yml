name: Rust release
on:
  workflow_dispatch:
    inputs:
      publish:
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash scripts/build.sh deps
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build native Rust executable
        run: make DRIVER_VERSION="$(cat data/nvidia-driver-version)"
      - name: Package binary and documentation
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          tar -czf "dist/nvibrant-${version}-linux-${{ matrix.arch }}.tar.gz" -C .build/bin nvibrant -C ../.. README.md docs LICENSE NOTICE.md licenses
      - uses: actions/upload-artifact@v4
        with:
          name: nvibrant-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
      - name: Publish release asset
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$VERSION" || gh release create "v$VERSION" --title "NVibrant $VERSION" --notes "Native Rust NVibrant. Build against headers matching your NVIDIA driver for hardware use." || gh release view "v$VERSION"
          gh release upload "v$VERSION" dist/*.tar.gz --clobber
