name: Bug report
description: Report a display, driver, installation or startup problem.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and steps to reproduce it.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and desktop
      placeholder: Arch Linux, niri
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version information
      description: Paste the output of `nvibrant --version`.
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Include relevant installer or terminal errors.
      render: text
