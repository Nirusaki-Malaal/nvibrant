<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">NVIDIA-style eye</title>
  <!-- Hand-coded eye contours. The large intrinsic canvas prevents GTK from
       enlarging a low-resolution texture when displaying this small mark. -->
  <g fill="#76b900" transform="translate(0 22)">
    <!-- Three negative-space channels cut into the right-hand field. -->
    <path fill-rule="evenodd" d="M49 0H128V84H49Z
      M49 11C77 8 100 25 115 37L106 44C91 30 73 17 49 20Z
      M49 64C74 67 94 58 115 40L124 48C104 66 76 77 49 73Z
      M49 25C69 22 86 31 98 44C84 60 66 65 49 60V52C63 57 77 52 87 44C77 33 63 29 49 33Z
      M49 37C59 34 69 37 77 44L67 52C62 45 57 43 49 44Z"/>
    <!-- The three open contours continue to the left of the field. -->
    <path d="M49 11V20C33 21 20 27 11 37C20 51 33 61 49 64V73C25 69 9 53 0 36C13 20 30 12 49 11Z"/>
    <path d="M49 25V33C40 35 33 39 28 44C33 51 40 56 49 58V66C33 63 21 54 16 43C24 34 35 27 49 25Z"/>
    <path d="M49 37V44C45 44 42 45 41 47C43 50 46 52 49 52V58C42 56 36 51 33 45C37 40 43 37 49 37Z"/>
  </g>
</svg>
