[project]
site_name = "NVibrant"
site_author = "Nirusaki-Malaal"
site_description = "Tool for Wayland to change vibrancy on NVIDIA GPUs."
site_url  = "https://nirusaki-malaal.github.io/nvibrant/"
repo_url  = "https://github.com/Nirusaki-Malaal/nvibrant/"
repo_name = "Nirusaki-Malaal/nvibrant"
extra_css = ["main.css"]
docs_dir  = "website"
nav = [
  {Repository = "https://github.com/Nirusaki-Malaal/nvibrant"},
  {Home = [
    "index.md",
    "changelog.md",
  ]},
  {Get = [
    "get/index.md",
    {Packages = [
      "get/pypi.md",
      "get/distro.md",
    ]},
    {Origins = [
      "get/source.md",
      "get/actions.md",
    ]},
    {Others = [
      "get/community.md",
    ]},
  ]},
  {Docs = [
    "docs/index.md",
    "docs/vibrance.md",
    "docs/dithering.md",
    "docs/autostart.md",
    "docs/laptop.md",
    "docs/multigpu.md",
  ]},
  {Help = [
    "help.md",
  ]}
]

[project.theme]
name = "zentheme"

[project.theme.icon]
logo = "octicons/chevron-right-16"
tag.default = "material/tag"

[project.extra.tags]
dummy = "key"

[project.plugins.social]
enabled = true

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Tremeschin"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/KjqvcYwRHm"
